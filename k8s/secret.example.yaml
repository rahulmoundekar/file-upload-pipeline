  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  SECURITY_API_TOKEN: replace-me
  SECURITY_API_ENABLED: "true"
  KAFKA_PRODUCER_ENABLED: "true"
  KAFKA_CONSUMER_ENABLED: "true"
  OUTBOX_PUBLISHER_ENABLED: "true"
