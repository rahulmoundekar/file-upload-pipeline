apiVersion: v1
kind: Secret
metadata: {name: file-upload-pipeline-secrets}
type: Opaque
stringData:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: file_upload
  DB_USERNAME: file_app
  DB_PASSWORD: replace-me
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  STORAGE_ENDPOINT: https://minio.example.internal
