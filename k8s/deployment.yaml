apiVersion: apps/v1
kind: Deployment
metadata: {name: file-upload-pipeline}
spec:
  replicas: 2
  selector: {matchLabels: {app: file-upload-pipeline}}
  template:
    metadata: {labels: {app: file-upload-pipeline}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: app
          image: your-registry/file-upload-pipeline:latest
          ports: [{containerPort: 8083}]
          envFrom: [{secretRef: {name: file-upload-pipeline-secrets}}]
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8083}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8083}, initialDelaySeconds: 30, periodSeconds: 20}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
