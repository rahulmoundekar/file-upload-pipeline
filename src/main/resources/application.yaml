spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file_upload}
    username: ${DB_USERNAME:file_app}
    password: ${DB_PASSWORD:root}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:50MB}

  # Spring Kafka configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

upload:
  max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:52428800}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket: ${STORAGE_BUCKET:file-uploads}
  secure: ${STORAGE_SECURE:false}

# Custom application Kafka configuration
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  dlt:
    suffix: .DLT

  producer:
    enabled: ${KAFKA_PRODUCER_ENABLED:false}


  consumer:
    enabled: ${KAFKA_CONSUMER_ENABLED:false}
    virus-scan-group: ${KAFKA_CONSUMER_VIRUS_SCAN_GROUP:virus-scan-worker}
    thumbnail-group: ${KAFKA_CONSUMER_THUMBNAIL_GROUP:thumbnail-worker}

  topics:
    file-uploaded: ${KAFKA_TOPIC_FILE_UPLOADED:file.uploaded}
    file-clean: ${KAFKA_TOPIC_FILE_CLEAN:file.clean}
    virus-scan: ${KAFKA_TOPIC_VIRUS_SCAN:file.virus-scan}
    thumbnail: ${KAFKA_TOPIC_THUMBNAIL:file.thumbnail}
    processing: ${KAFKA_TOPIC_PROCESSING:file.processing}
    webhook: ${KAFKA_TOPIC_WEBHOOK:file.webhook}

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
    scheduler-enabled: ${OUTBOX_PUBLISHER_SCHEDULER_ENABLED:true}
    delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:1000}

    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    initial-backoff-ms: ${OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${OUTBOX_MAX_BACKOFF_MS:60000}

clamav:
  host: ${CLAMAV_HOST:localhost}
  port: ${CLAMAV_PORT:3310}

  connection-timeout-ms: ${CLAMAV_CONNECTION_TIMEOUT_MS:5000}
  read-timeout-ms: ${CLAMAV_READ_TIMEOUT_MS:60000}

  chunk-size-bytes: ${CLAMAV_CHUNK_SIZE_BYTES:8192}

thumbnail:
  width: ${THUMBNAIL_WIDTH:300}
  height: ${THUMBNAIL_HEIGHT:300}
  format: ${THUMBNAIL_FORMAT:jpg}
  quality: ${THUMBNAIL_QUALITY:0.85}