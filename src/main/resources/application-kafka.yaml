spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    deletion-group: ${KAFKA_CONSUMER_DELETION_GROUP:file-deletion-worker}
  topics:
    file-deleted: ${KAFKA_TOPIC_FILE_DELETED:file-deleted}

outbox:
  publisher:
    enabled: true
    delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:1000}
