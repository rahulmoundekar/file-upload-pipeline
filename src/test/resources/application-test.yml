storage:
  bucket: file-uploads-test
  bucket-initializer:
    enabled: false
    deletion-group: file-deletion-worker

spring:
  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

kafka:
  consumer:
    enabled: false
  topics:
    file-deleted: file-deleted

outbox:
  publisher:
    enabled: false

webhook:
  enabled: false