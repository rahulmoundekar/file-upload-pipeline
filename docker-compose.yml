services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: file_upload
      POSTGRES_USER: file_app
      POSTGRES_PASSWORD: change-me
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U file_app -d file_upload"], interval: 10s, timeout: 5s, retries: 10}
  kafka:
    image: apache/kafka:4.0.0
    ports: ["9092:9092"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: change-me}
    ports: ["9000:9000","9001:9001"]
    volumes: [miniodata:/data]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
  app:
    build: .
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_started}, minio: {condition: service_started}, clamav: {condition: service_started}}
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: file_upload
      DB_USERNAME: file_app
      DB_PASSWORD: change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: change-me
      STORAGE_BUCKET: file-uploads
      STORAGE_BUCKET_INITIALIZER_ENABLED: "true"
      CLAMAV_HOST: clamav
      KAFKA_PRODUCER_ENABLED: "true"
      KAFKA_CONSUMER_ENABLED: "true"
      OUTBOX_PUBLISHER_ENABLED: "true"
    ports: ["8083:8083"]
volumes: {pgdata: {}, miniodata: {}}
